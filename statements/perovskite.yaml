reading_point:
  principle: >
    Measured quantities, stated physical models, and Lean-verified
    consequences remain distinct reading points. Combining specifications
    requires an explicit model; numerical or conceptual proximity alone
    does not identify them.

  examples:
    coherence:
      value: "C"
      specification: "C = T2 / (2 T1), with 0 < C ≤ 1"

    transform_limit:
