      specification: "T2 = 2 T1"

    relaxation:
      value: "L"
      specification: "L = Γ_relaxation / (Γ_relaxation + Γ_X), with 0 < L < 1"

    hom_visibility:
      value: "V_HOM"
      specification: "0 ≤ V_HOM ≤ L under the stated relaxation specification"

    combined:
      value: "I"
      specification: "I = C L under the stated combined model"

leading_specification: >
  Exciton coherence and stochastic-relaxation timing jitter specify
  distinct constraints on photon indistinguishability. Under the
  source-supported multiplicative model, their combined effect is
  I = C L, and Lean verifies the resulting component bounds.

