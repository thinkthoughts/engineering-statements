statement:
  coherence: >
    For positive radiative recombination time T1 and coherence/dephasing
    time T2 satisfying T2 ≤ 2 T1, the normalized coherence quantity
    C = T2 / (2 T1) satisfies 0 < C ≤ 1. The transform limit
    T2 = 2 T1 is equivalent to C = 1.

  relaxation: >
    For positive Γ_relaxation and Γ_X, the stochastic-relaxation
    quantity L = Γ_relaxation / (Γ_relaxation + Γ_X) satisfies
    0 < L < 1. Increasing Γ_relaxation with Γ_X fixed cannot decrease L,
    while increasing Γ_X with Γ_relaxation fixed cannot increase L.

  combined: >
    A source-supported quantum-dot model combines coherence/dephasing
    and stochastic-relaxation timing-jitter effects multiplicatively:
    I = C L. Under the stated positivity and coherence constraints,
    Lean verifies 0 < I < 1, I < C, and I ≤ L.

  engineering_consequence: >
    Within the stated combined model, improving coherence alone leaves
    photon indistinguishability constrained by stochastic-relaxation
    timing jitter, while improving the relaxation factor alone leaves
    photon indistinguishability constrained by coherence.

  distinction: >
    The coherence specification C, the stochastic-relaxation
    specification L, measured HOM visibility, and the combined model I
    remain separately specified objects. The combined model is not
    presented as a relation derived from Dong's perovskite measurements.

  formalization: >
    The lean-perovskite repository encodes these specifications in Lean
    and verifies their mathematical consequences with a successful
    lake build under the pinned Lean and mathlib versions.

engineering_statement: >
  Photon indistinguishability is jointly constrained by coherence and
  stochastic-relaxation timing jitter. The coherence quantity
  C = T2 / (2 T1) and relaxation quantity
  L = Γ_relaxation / (Γ_relaxation + Γ_X) retain distinct measurable
  specifications; under the stated multiplicative model I = C L,
  Lean verifies that the combined indistinguishability remains bounded
  by both component constraints.

