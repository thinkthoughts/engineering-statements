engineering_statement: >
  Independently specified ReadingPoint arithmetic and executable M5
  liquid-crystal topology admit compatible V4 quotient structure.
  Native observables further produce compatible singleton-plus-pair
  partitions, reducing six abstract quotient isomorphisms to two.
  Existing M5/N4 orientation audits do not independently select between
  the two remaining mappings.

