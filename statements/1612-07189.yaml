reading_point:
  principle: >
    A repeated numeral establishes numerical equality, not structural
    correspondence. Each reading point retains the definition and
    constraint supplied by its domain.

  examples:
    kelmans_seymour:
      value: 5
      specification: "κ(G) ≥ 5"

    K5_subdivision:
      value: 5
      specification: "five branch vertices"

    physical_hand:
      value: 5
      specification: "five digit positions"

    so10:
