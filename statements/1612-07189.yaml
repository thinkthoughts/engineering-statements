status: "complete"

leading_constraints:
  - "G is 5-connected."
  - "G is nonplanar."
  - "5-connectivity means that removing any set of fewer than 5 vertices leaves G connected."
  - "Equivalently, κ(G) ≥ 5."

engineering_objects:
  - "graph G"
  - "vertex cut S"
  - "vertex-connectivity κ(G)"
  - "subdivision TK5 of K5"
  - "five branch vertices"
  - "ten pairwise internally vertex-disjoint paths"
  - "unit classes modulo 30"

measurable_states:
  - "|S| < 5"
  - "G - S remains connected"
  - "κ(G) ≥ 5"
  - "five branch vertices in TK5"
  - "C(5,2) = 10 branch-vertex pairs"
  - "30 = 2 × 3 × 5"
  - "φ(30) = 8"
  - "(Z/30Z)^× = {1, 7, 11, 13, 17, 19, 23, 29}"

statement:
  theorem: >
    If G is 5-connected and nonplanar, then G contains a subdivision
    of K5.

  connectivity: >
    The numeral 5 first specifies a vertex-connectivity threshold:
    every set S with |S| ≤ 4 leaves G - S connected.

  conclusion: >
    The guaranteed K5 subdivision contains five branch vertices,
    with one internally vertex-disjoint path for each of the
    C(5,2) = 10 branch-vertex pairs.

  distinction: >
    The connectivity threshold 5 and the five branch vertices have
    distinct structural roles. The theorem relates these structures
    without identifying the two uses of 5.

  cross_domain: >
    The numeral 5 also occurs in independently specified structures:
    a physical hand has five digit positions, so(10) has rank 5,
    and 5 is one prime factor of the modulus 30. Numerical equality
    does not by itself establish structural correspondence.

  mod30: >
    For 30 = 2 × 3 × 5, exactly eight residue classes are coprime to 30:
    {1, 7, 11, 13, 17, 19, 23, 29}. These form the multiplicative
    group of units modulo 30.

engineering_statement: >
  Reading points preserve the constraints that specify them.
  In the Kelmans-Seymour theorem, 5 specifies a lower bound on
  vertex connectivity; in the guaranteed K5 subdivision, five
  specifies the number of branch vertices. A hand, rank-5 so(10),
  and the factor 5 in 30 provide separately defined occurrences
  of the same numeral. Each occurrence retains its own object,
  definition, and constraint.

