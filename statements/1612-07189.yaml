leading_specification: >
  Five-connectivity together with nonplanarity constrains G strongly
  enough to guarantee a K5 subdivision, while each occurrence of the
  numeral 5 remains attached to its independently specified structure.

footer: "Admissible generalizations trail leading specifications."
