constraints:
  - Electricity demand alone does not specify associated operational emissions.
  - Associated operational emissions depend on power-system conditions.
  - Clean-energy matching requires specified reading points.
  - Matching remains constrained by physical deliverability.
  - Location-specific claims require location-specific measurements.

