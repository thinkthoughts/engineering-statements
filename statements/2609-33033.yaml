objective: >
  Track the specification structure exposed by Wang's Lean formalization
  of the Galerkin construction for two-dimensional Navier–Stokes equations.

contexts:
  - Galerkin construction
  - Leray–Hopf weak solutions
  - Lean 4 formalization
  - reading points
  - specification grammar

constraints:
  - Exact Galerkin identities establish uniform energy control.
  - Strong velocity convergence and weak energy-space convergence constrain the limiting construction.
  - Weak lower semicontinuity yields the inherited every-time energy inequality.
  - The established weakly continuous representative supplies the specified reading point.

evidence:
  - Galerkin construction → established representative → reading point.
  - Exact Galerkin identity → inherited limiting inequality.
  - Integer-horizon representatives agree pointwise on overlaps.
  - A common refined subsequence supports the nonlinear limit, weakly continuous representative, and energy argument.

