title: Independent Training Specifies Robust Coordination

statement: |
  Robust coordination between independently developed agents
  requires interaction conventions that generalize across
  unfamiliar partners.

engineering_object:
  Independent Multi-Agent Coordination

engineering_problem: |
  Agents trained through independent self-play may develop
  incompatible interaction conventions that prevent effective
  coordination with unfamiliar partners.

engineering_context:
  - Cooperative AI
  - Multi-agent systems
  - Ad-hoc teamwork
  - Partner substitution
  - Independent optimization

engineering_specification:
  Independent Agents
          │
          ▼
  Observable Signals
          │
          ▼
  Shared Interaction Conventions
          │
          ▼
  Partner Generalization
          │
          ▼
  Measured Coordination
          │
          ▼
  Robust Deployment

measured_states:
  - Self-play coordination
  - Ad-hoc coordination
  - Partner generalization
  - Coordination performance
  - Convention compatibility

measured_observations:
  - High self-play performance does not guarantee coordination with independently trained partners.
  - Independently trained agents may assign different meanings to the same observable signals.
  - Partner substitution reveals incompatible interaction conventions.
  - Robust deployment requires coordination beyond familiar training partners.

