summary: |
  Independent optimization can produce highly effective
  self-play strategies while simultaneously developing
  incompatible interaction conventions. Robust coordination
  therefore depends on conventions that generalize across
  independently trained partners rather than only within
  familiar training environments.

footer: |
  Robust coordination specifies interaction conventions
  that generalize across independently trained partners.
